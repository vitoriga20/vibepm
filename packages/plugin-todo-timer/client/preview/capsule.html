<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>番茄胶囊</title>
  <link rel="stylesheet" href="base/css/color.css" />
  <link rel="stylesheet" href="style/capsule.css" />
  <link rel="stylesheet" href="style/flap.css" />
</head>

<body>
  <!-- 桌面胶囊：左 = 盆栽生长动画；右 = 工业科研终端风格翻牌倒计时器 -->
  <div id="capsuleWin">
    <div class="capHead" id="capHead" title="拖拽移动 · 双击打开主界面">
      <span class="pill-dot"></span>
      <span class="pill-state" id="capState">休息中</span>
      <span class="pill-task" id="capTask" style="display:none"></span>
    </div>

    <div class="capBody">
      <!-- 左：盆栽生长动画（透明底，只显示盆栽） -->
      <div class="capStage">
        <iframe id="tomatoLife" src="tomato-life.html" title="番茄生长动画"></iframe>
      </div>

      <!-- 右：工业科研终端 · 翻牌倒计时器（机械记牌器风格，非电子数码钟） -->
      <div class="capPanel">
        <div class="devHead">
          <span class="devId">T-04 / FIELD TIMER</span>
          <span class="devLed" id="devLed" title="设备运行灯"></span>
        </div>

        <div class="devClock">
          <div class="flap" data-digit="0">
            <div class="fh fh-top"><span class="fv">0</span></div>
            <div class="fh fh-bot"><span class="fv">0</span></div>
            <div class="fh fh-fold"><span class="fv"></span></div>
            <div class="fh fh-rise"><span class="fv"></span></div>
          </div>
          <div class="flap" data-digit="1">
            <div class="fh fh-top"><span class="fv">0</span></div>
            <div class="fh fh-bot"><span class="fv">0</span></div>
            <div class="fh fh-fold"><span class="fv"></span></div>
            <div class="fh fh-rise"><span class="fv"></span></div>
          </div>
          <div class="flapColon"><span class="dot"></span><span class="dot"></span></div>
          <div class="flap" data-digit="2">
            <div class="fh fh-top"><span class="fv">0</span></div>
            <div class="fh fh-bot"><span class="fv">0</span></div>
            <div class="fh fh-fold"><span class="fv"></span></div>
            <div class="fh fh-rise"><span class="fv"></span></div>
          </div>
          <div class="flap" data-digit="3">
            <div class="fh fh-top"><span class="fv">0</span></div>
            <div class="fh fh-bot"><span class="fv">0</span></div>
            <div class="fh fh-fold"><span class="fv"></span></div>
            <div class="fh fh-rise"><span class="fv"></span></div>
          </div>
        </div>

        <div class="devStatus" id="devStatus"><span id="devStatusPre">EXPEDITION WINDOW</span><span id="devStatusSep"> / </span><span id="devRun">STANDBY</span></div>
        <div class="devProgress"><div class="devProgressBar" id="devProgressBar"></div></div>

        <div class="devCtl">
          <button class="devBtn primary" id="beginBtn">START</button>
          <button class="devBtn" id="pauseBtn" style="display:none">PAUSE</button>
          <button class="devBtn" id="stopBtn" style="display:none">RESET</button>
        </div>

        <div class="devFoot"><span class="devCal">CAL 24.9 Hz · T+0001 · NOMINAL</span></div>
      </div>
    </div>

    <div class="capFoot">
      <span class="todayStats" id="todayStats">
        <span><img src="pic/tomato.png" /> ×<span id="todayRed">0</span></span>
        <span class="sep">|</span>
        <span><img src="pic/tomato_yellow.png" /> ×<span id="todayYellow">0</span></span>
        <span class="sep">|</span>
        <span class="focusMin"><span id="todayMinutes">0</span> min</span>
      </span>
      <span class="menuBtn" id="menuBtn" title="菜单（右键同样打开）">⋯</span>
      <div class="dropdown" id="dropdown">
        <div class="menuItem" id="miDone">完成「在做」任务</div>
        <div class="menuItem" id="miOpen">打开主界面</div>
        <div class="menuItem" id="miDark">切换深浅色</div>
        <div class="menuItem" id="miClose">关闭胶囊</div>
      </div>
    </div>
  </div>

  <script src="base/js/settingsConfig.js"></script>
  <script src="js/env.js"></script>
  <script src="js/todoData.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/clockSync.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/capsule.js"></script>
</body>

</html>
