<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>vibepm 桌面胶囊</title>
  <link rel="stylesheet" href="base/css/color.css" />
  <link rel="stylesheet" href="style/capsule.css" />
  <script src="js/theme.js"></script>
</head>

<body>
  <!-- 桌面胶囊：胶囊条在上 + 番茄生长动画在下（壳置顶窗 / 浏览器 popup） -->
  <div id="growWin">
    <div class="growHead" id="growHead" title="拖拽移动 · 双击打开主界面">
      <span class="pill-dot"></span>
      <span class="pill-state" id="growState">休息中</span>
      <!-- 专注任务名（syncTask 注入；归属链与主页面同口径） -->
      <span class="pill-task" id="pill-task" style="display:none"></span>
      <span class="pill-time" id="growTime">30 min</span>
      <span class="pill-close" id="capsuleClose" title="关闭（同时关闭「桌面胶囊」开关）">×</span>
    </div>
    <iframe id="tomatoLife" src="tomato-life.html" title="番茄生长动画"></iframe>
  </div>
  <script src="base/js/settingsConfig.js"></script>
  <script src="js/env.js"></script>
  <script src="js/todoData.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/clockSync.js"></script>
  <script src="js/growBridge.js"></script>
  <script src="js/capsule.js"></script>
</body>

</html>
