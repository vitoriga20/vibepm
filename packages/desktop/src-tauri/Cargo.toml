[package]
name = "vibepm-desktop"
version = "0.1.0"
description = "vibepm desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

# ===== 岛能力（M2 S7，NSD 复用，版本与 NetSpeed Dynamic Pro 对齐防漂移）=====
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
urlencoding = "2.1.3"
lazy_static = "1.5.0"
reqwest = { version = "0.12", features = ["json"] }
cpal = "0.15"
realfft = "3"
rand = "0.8"
tokio-tungstenite = "0.21"
futures-util = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
] }
winapi = { version = "0.3", features = ["winuser", "windef", "shellapi", "winbase", "libloaderapi"] }
windows = { version = "0.58.0", features = [
    "UI_Notifications_Management",
    "UI_Notifications",
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "implement",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Power",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
